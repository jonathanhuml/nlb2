# Original task adapters operate on millisecond NWB/MAT samples. Prepared-data
# runs derive their sampling interval and alignment from the training dataset.
area2_bump:
  settings:
    trial_alignment: [-700, 851]
    test_alignment: [-100, 501]
  hyperparams:
    trajectories_alignment: [-350, 751]
    sigma: 25
    window_length: 240
  nlb_hyperparams: &nlb
    causal: false
    window_length: 500
    n_candidates: 2
    min_rate: 0.1
mc_maze:
  settings:
    trial_alignment: [-800, 901]
    test_alignment: [-250, 451]
  hyperparams:
    trajectories_alignment: [-500, 701]
    sigma: 30
    n_cond_dims: 21
    window_length: 300
  nlb_hyperparams: *nlb
mc_rtt:
  settings:
    trial_alignment: [-600, 1201]
    test_alignment: [0, 600]
  hyperparams:
    window_length: 480
    n_candidates: 6
    interp_within_trajectories: true
  nlb_hyperparams:
    <<: *nlb
    n_candidates: 5
dmfc_rsg:
  settings:
    trial_alignment: [-1950, 750]
    test_alignment: [-1500, 0]
  hyperparams:
    trajectories_alignment: [-1950, 750]
    sigma: 55
    n_neural_dims: 49
    n_cond_dims: 17
    n_trial_dims: null
    causal: false
    window_length: 1500
    dmfc_section_count: 6
  nlb_hyperparams:
    <<: *nlb
    window_length: 1500
lorenz: &synthetic
  settings:
    Ts: 0.2
    trial_alignment: [0, 100]
    test_alignment: [0, 100]
  hyperparams: &synthetic_hyperparams
    trajectories_alignment: [0, 100]
    min_lambda: 0.001
    sigma: 2
    Delta: 1
    window_length: 6
    n_candidates: 4
    causal: false
    n_trial_dims: null
chaotic_rnn:
  <<: *synthetic
  settings:
    Ts: 0.01
    trial_alignment: [0, 100]
    test_alignment: [0, 100]
auto:
  hyperparams:
    <<: *synthetic_hyperparams
    n_candidates: 2
allen_vcn:
  settings:
    Ts: 0.02
    trial_alignment: [0, 100]
    test_alignment: [0, 100]
  hyperparams:
    <<: *synthetic_hyperparams
    interp: 0
