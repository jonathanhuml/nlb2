[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlb2"
version = "0.1.1"
description = "PyTorch benchmark scaffolding for latent neural dynamics models."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jon Huml" },
]
keywords = ["latent-dynamics", "neuroscience", "pytorch", "benchmarking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gpytorch",
  "dandi",
  "h5py>=3.8",
  "linear-operator",
  "nlb-tools",
  "numpy>=1.24",
  # nlb-tools 0.0.4 mutates NumPy views, incompatible with pandas 3 copy-on-write.
  "pandas>=1.5,<3",
  "pydantic>=2",
  "scikit-learn>=1.0",
  "scipy>=1.10",
  "torch>=2.1.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["mkdocs>=1.6"]
benchmarks = [
  "matplotlib>=3.4.3",
  "tueplots>=0.2.4; python_version >= '3.10'",
]
data = ["dandi"]
tuning = ["ray[tune]>=2.43,<3", "optuna>=3,<5"]

[project.scripts]
nlb2 = "nlb2.cli:main"

[project.urls]
Homepage = "https://zkunkworks.com/"
Documentation = "https://zkunkworks.com/nlb2/"
Repository = "https://github.com/jonathanhuml/nlb2"
Issues = "https://github.com/jonathanhuml/nlb2/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nlb2.models" = ["mint_presets.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
