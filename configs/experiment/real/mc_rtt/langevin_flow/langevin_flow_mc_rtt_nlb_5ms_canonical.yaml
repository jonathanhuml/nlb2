dataset:
  name: mc_rtt
  split: val
  bin_size_ms: 5
  input_mode: heldin
  include_forward: true

model:
  name: langevin_flow
  objective: langevin_flow_elbo
  hidden_size: 280
  initialization: nlb2
  output_mode: auto
  fwd_steps: 0
  dropout: 0.05
  gamma: 0.55
  langevin_step: 0.01
  potential_groups: 4
  potential_kernel_size: 3
  transformer_heads: 2
  transformer_feedforward: 512
  coordinated_dropout_rate: 0.3
  kl_weight: 0.1
  kl_warmup_epochs: 500
  weight_decay_warmup_epochs: 500
  velocity_prior_var: 0.1
  log_rate_min: -8.0
  log_rate_max: 8.0
  posterior_logvar_min: -9.210340371976182
  posterior_logvar_max: 5.0
  sample_train: true
  sample_eval: false
  prediction_samples: 50
  optimization:
    name: gradient
    optimizer: Adam
    lr: 3.0e-3
    weight_decay: 2.0e-5
    gradient_clip: 200.0
    lr_scheduler: ReduceLROnPlateau
    scheduler_factor: 0.95
    scheduler_patience: 10
    scheduler_threshold: 0.0
    scheduler_min_lr: 1.0e-5

preprocessing:
  observations: null

trainer:
  epochs: 6000
  batch_size: 64
  device: cuda

experiment:
  output_dir: runs/langevin_flow_canonical_20260802
  run_name: langevin_flow_mc_rtt_nlb_5ms_canonical
  save_predictions: true
